openapi: 3.1.0
info:
  title: CRM Conversacional API
  version: 0.1.0
  description: API de domínio e persistência integrada ao WhatsApp Gateway.
servers:
  - url: https://crm-api.example.com
security:
  - InternalHmac: []
tags:
  - name: Internal
  - name: Customers
  - name: Price Lists
  - name: Offers
  - name: Portal Authentication
    description: >
      Sessão do portal do representante. Esquema independente do HMAC do Gateway:
      uma chamada assinada entre serviços não concede papel administrativo e um
      cookie de sessão não autoriza rotas internas.

paths:
  /admin/auth/login:
    post:
      tags: [Portal Authentication]
      operationId: loginPortalUser
      security: []
      description: >
        Autentica um usuário do portal no tenant da implantação e emite um cookie de
        sessão httpOnly. Credencial inválida, conta inativa e conta bloqueada produzem
        a mesma resposta, para não revelar a existência da conta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sessão emitida
          headers:
            Set-Cookie:
              description: Cookie de sessão httpOnly, SameSite=Lax e Secure em produção.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /admin/auth/logout:
    post:
      tags: [Portal Authentication]
      operationId: logoutPortalUser
      security:
        - PortalSession: []
      description: Revoga a sessão vigente no servidor e remove o cookie.
      responses:
        "204":
          description: Sessão revogada
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/auth/me:
    get:
      tags: [Portal Authentication]
      operationId: getPortalUser
      security:
        - PortalSession: []
      description: >
        Devolve o usuário da sessão. Revalida a ativação do usuário a cada chamada,
        de modo que desativar a conta invalida cookies já emitidos.
      responses:
        "200":
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /internal/interaction-capabilities:
    get:
      tags: [Interaction Capabilities]
      operationId: getInternalInteractionCapabilities
      description: >
        Publica o manifesto versionado de intenções e ações permitidas pelo CRM para o
        Gateway durante uma sessão de contato. O manifesto não contém URLs, SQL, fórmulas
        comerciais nem conteúdo de preço.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Timestamp"
      responses:
        "200":
          description: Manifesto de capacidades de interação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionCapabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /health:
    get:
      security: []
      operationId: getHealth
      responses:
        "200":
          description: Serviço saudável
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: crm-conversacional-api

  /ready:
    get:
      security: []
      operationId: getReadiness
      responses:
        "200":
          description: Banco de dados acessível
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: crm-conversacional-api
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /internal/whatsapp/events:
    post:
      tags: [Internal]
      operationId: receiveWhatsappEvent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/Timestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappEvent"
      responses:
        "202":
          description: Evento aceito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal/outbound-status:
    post:
      tags: [Internal]
      operationId: updateOutboundStatus
      parameters:
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/Timestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundStatusUpdate"
      responses:
        "204":
          description: Status atualizado
        "404":
          $ref: "#/components/responses/NotFound"

  /customers/by-whatsapp/{phone}:
    get:
      tags: [Customers]
      operationId: findCustomerByWhatsapp
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Timestamp"
        - name: phone
          in: path
          required: true
          description: Telefone E.164, com o sinal + codificado na URL.
          schema:
            type: string
            pattern: "^\\+[1-9][0-9]{7,14}$"
      responses:
        "200":
          description: Cliente e contato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerContact"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /customers/{customerId}/preferred-products:
    get:
      tags: [Customers]
      operationId: listPreferredProducts
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Produtos preferenciais ativos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PreferredProduct"

  /price-lists/current:
    get:
      tags: [Price Lists]
      operationId: getCurrentPriceList
      parameters:
        - name: at
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Tabela ativa na data informada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceListSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /price-lists/current/by-whatsapp/{phone}:
    get:
      tags: [Price Lists]
      operationId: getCurrentPriceListByWhatsapp
      description: >
        Retorna a tabela ativa e seus itens para o contato ativo identificado pelo WhatsApp,
        sempre dentro do tenant assinado pelo Gateway. Itens indisponíveis não expõem preço.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Timestamp"
        - name: phone
          in: path
          required: true
          description: Telefone E.164, com o sinal + codificado na URL.
          schema:
            type: string
            pattern: "^\\+[1-9][0-9]{7,14}$"
      responses:
        "200":
          description: Contato, tabela vigente e itens de preço
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentPriceList"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /price-lists/current/by-whatsapp/{phone}/items:
    get:
      tags: [Price Lists]
      operationId: searchCurrentPriceListItemsByWhatsapp
      description: >
        Retorna somente os itens da tabela ativa que correspondem a todos os termos de busca
        no SKU, nome comercial, especificação ou família. Uma resposta 200 com itens vazios
        significa que o contato e a tabela existem, mas não houve correspondência.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Timestamp"
        - name: phone
          in: path
          required: true
          description: Telefone E.164, com o sinal + codificado na URL.
          schema:
            type: string
            pattern: "^\\+[1-9][0-9]{7,14}$"
        - name: query
          in: query
          required: true
          description: Termos do produto; todos devem corresponder deterministicamente.
          schema:
            type: string
            minLength: 2
            maxLength: 120
      responses:
        "200":
          description: Contato, tabela vigente e itens encontrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentPriceList"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /offers/preview:
    post:
      tags: [Offers]
      operationId: previewOffer
      description: Calcula a oferta sem persistir uma nova oferta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferRequest"
      responses:
        "200":
          description: Prévia calculada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferPreview"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /offers:
    post:
      tags: [Offers]
      operationId: createOffer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferRequest"
      responses:
        "201":
          description: Oferta persistida como fotografia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /offers/{offerId}:
    get:
      tags: [Offers]
      operationId: getOffer
      parameters:
        - $ref: "#/components/parameters/OfferId"
      responses:
        "200":
          description: Oferta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "404":
          $ref: "#/components/responses/NotFound"

  /offers/{offerId}/approve:
    post:
      tags: [Offers]
      operationId: approveOffer
      parameters:
        - $ref: "#/components/parameters/OfferId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved_by]
              properties:
                approved_by:
                  type: string
                  minLength: 1
                final_message:
                  type: string
      responses:
        "200":
          description: Oferta aprovada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "409":
          $ref: "#/components/responses/Conflict"

  /offers/{offerId}/send:
    post:
      tags: [Offers]
      operationId: sendOffer
      description: Envia somente ofertas previamente aprovadas.
      parameters:
        - $ref: "#/components/parameters/OfferId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Envio solicitado ao Gateway
          content:
            application/json:
              schema:
                type: object
                required: [offer_id, status]
                properties:
                  offer_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    const: PENDING
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    InternalHmac:
      type: apiKey
      in: header
      name: X-Signature
    PortalSession:
      type: apiKey
      in: cookie
      name: crm_session
      description: >
        Sessão com estado no servidor. O cookie carrega o token em claro; o banco
        guarda apenas o SHA-256 dele, e o logout revoga a sessão de fato.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    Signature:
      name: X-Signature
      in: header
      required: true
      schema:
        type: string
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      schema:
        type: string
        format: date-time
    TenantSlug:
      name: X-Tenant-Slug
      in: header
      required: true
      description: Tenant resolvido pelo Gateway para o aplicativo e fluxo ativos.
      schema:
        type: string
        minLength: 1
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Assinatura ausente, inválida ou expirada
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Papel insuficiente para a operação
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Excesso de tentativas na janela
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflito de estado ou idempotência
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: Regra de negócio não atendida
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Dependência operacional indisponível
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        trace_id:
          type: string

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
          description: Normalizado para caixa baixa antes da busca.
        password:
          type: string
          minLength: 1
          format: password

    AuthenticatedUser:
      type: object
      required: [user_id, tenant_id, full_name, email, role]
      properties:
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [ADMIN, MANAGER, REPRESENTATIVE]

    WhatsappEvent:
      type: object
      additionalProperties: false
      required: [event_id, received_at, channel, waba_id, phone_number_id, from, message]
      properties:
        event_id:
          type: string
        received_at:
          type: string
          format: date-time
        channel:
          type: string
          const: whatsapp
        waba_id:
          type: string
        phone_number_id:
          type: string
        from:
          type: string
          pattern: "^[1-9][0-9]{7,14}$"
        message:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [text]
            text:
              type: string
        metadata:
          type: object
          additionalProperties: true

    EventAccepted:
      type: object
      required: [event_id, status]
      properties:
        event_id:
          type: string
        status:
          type: string
          enum: [ACCEPTED, ALREADY_PROCESSED]

    OutboundStatusUpdate:
      type: object
      required: [gateway_message_id, status, occurred_at]
      properties:
        gateway_message_id:
          type: string
        status:
          type: string
          enum: [SENT, DELIVERED, READ, FAILED]
        occurred_at:
          type: string
          format: date-time
        error:
          type: string

    CustomerContact:
      type: object
      required: [customer_id, customer_name, state_code, contact_id, contact_name, whatsapp_e164]
      properties:
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        state_code:
          type: string
          pattern: "^[A-Z]{2}$"
        contact_id:
          type: string
          format: uuid
        contact_name:
          type: string
        whatsapp_e164:
          type: string

    InteractionIntent:
      type: object
      required: [id, description, aliases, examples, action, required_slots]
      properties:
        id:
          type: string
        description:
          type: string
        aliases:
          type: array
          items:
            type: string
        examples:
          type: array
          items:
            type: string
        action:
          type: string
          enum: [GET_CURRENT_PRICE_LIST, SEARCH_CURRENT_PRICE_LIST_ITEMS]
        required_slots:
          type: array
          items:
            type: string

    InteractionCapabilities:
      type: object
      required: [provider, version, session_ttl_seconds, fallback_message, intents]
      properties:
        provider:
          type: string
          const: crm_api
        version:
          type: string
        session_ttl_seconds:
          type: integer
          minimum: 60
          maximum: 86400
        fallback_message:
          type: string
        intents:
          type: array
          items:
            $ref: "#/components/schemas/InteractionIntent"

    PreferredProduct:
      type: object
      required: [product_id, sku, display_name, display_order]
      properties:
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        display_name:
          type: string
        display_order:
          type: integer

    PriceListSummary:
      type: object
      required: [id, name, reference_month, valid_from, currency]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        reference_month:
          type: string
          format: date
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: [string, "null"]
          format: date-time
        currency:
          type: string
          pattern: "^[A-Z]{3}$"

    CurrentPriceListItem:
      type: object
      required:
        [product_id, family_name, sku, display_name, specification, unit, availability, base_price]
      properties:
        product_id:
          type: string
          format: uuid
        family_name:
          type: string
        sku:
          type: string
        display_name:
          type: string
        specification:
          type: [string, "null"]
        unit:
          type: string
          const: KG
        availability:
          type: string
          enum: [AVAILABLE, OUT_OF_STOCK, SUSPENDED, FUTURE_ARRIVAL, CONSULT]
        base_price:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: Nulo quando não existe preço comercial atual para o item indisponível.
        expected_arrival_date:
          type: [string, "null"]
          format: date
        arrival_note:
          type: [string, "null"]
        notes:
          type: [string, "null"]

    CurrentPriceList:
      type: object
      required: [customer, price_list, items]
      properties:
        customer:
          $ref: "#/components/schemas/CustomerContact"
        price_list:
          $ref: "#/components/schemas/PriceListSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/CurrentPriceListItem"

    OfferRequest:
      type: object
      additionalProperties: false
      required: [customer_id, destination_state, payment_term, product_ids]
      properties:
        customer_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        destination_state:
          type: string
          pattern: "^[A-Z]{2}$"
        payment_term:
          type: string
          enum: [TERM, ANTICIPATED, DAYS_14]
        product_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        quantities_kg:
          type: object
          additionalProperties:
            type: string
            pattern: "^[0-9]+(\\.[0-9]{1,3})?$"

    Money:
      type: string
      description: Valor decimal; nunca ponto flutuante.
      pattern: "^-?[0-9]+(\\.[0-9]{1,4})?$"
      examples: ["12.0500"]

    OfferItem:
      type: object
      required:
        [product_id, display_name, base_price, payment_price, freight_per_kg,
         final_price_per_kg, availability]
      properties:
        product_id:
          type: string
          format: uuid
        display_name:
          type: string
        base_price:
          $ref: "#/components/schemas/Money"
        payment_price:
          $ref: "#/components/schemas/Money"
        freight_per_kg:
          $ref: "#/components/schemas/Money"
        final_price_per_kg:
          $ref: "#/components/schemas/Money"
        availability:
          type: string
          enum: [AVAILABLE, OUT_OF_STOCK, SUSPENDED, FUTURE_ARRIVAL, CONSULT]
        expected_arrival_date:
          type: [string, "null"]
          format: date
        note:
          type: [string, "null"]

    OfferPreview:
      type: object
      required: [customer_id, reference_month, currency, items, message_preview]
      properties:
        customer_id:
          type: string
          format: uuid
        reference_month:
          type: string
          format: date
        currency:
          type: string
          const: BRL
        items:
          type: array
          items:
            $ref: "#/components/schemas/OfferItem"
        message_preview:
          type: string

    Offer:
      allOf:
        - $ref: "#/components/schemas/OfferPreview"
        - type: object
          required: [id, status, created_at]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, SENT, FAILED, CANCELLED]
            approved_by:
              type: [string, "null"]
            approved_at:
              type: [string, "null"]
              format: date-time
            sent_at:
              type: [string, "null"]
              format: date-time
            created_at:
              type: string
              format: date-time
