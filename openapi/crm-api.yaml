openapi: 3.1.0
info:
  title: CRM Conversacional API
  version: 0.1.0
  description: API de domínio e persistência integrada ao WhatsApp Gateway.
servers:
  - url: https://crm-api.example.com
security:
  - InternalHmac: []
tags:
  - name: Internal
  - name: Customers
  - name: Price Lists
  - name: Offers
  - name: Portal Users
    description: Administração de usuários e representantes. Exclusiva do papel ADMIN.
  - name: Pricing
    description: >
      Preço resolvido por cliente e matriz de ICMS. O preço vigente é chaveado por
      (tenant, competência, produto); a alíquota vem do par UF de origem → destino.
  - name: Interactions
    description: >
      Histórico de interações do cliente. É uma projeção alimentada por push pelo Gateway,
      que continua dono da conversa; o CRM guarda o suficiente para montar a linha do tempo
      da ficha sem consultá-lo.
  - name: Customer Records
    description: >
      Cadastro comercial: cliente, contatos e localidades. Contatos e localidades são
      sempre alcançados pelo customerId, que passa pelo escopo de carteira.
  - name: Portfolio
    description: >
      Carteira de clientes. O escopo de linha é aplicado na consulta ao banco, não na
      apresentação, e cliente fora da carteira responde 404 em vez de 403.
  - name: Portal Authentication
    description: >
      Sessão do portal do representante. Esquema independente do HMAC do Gateway:
      uma chamada assinada entre serviços não concede papel administrativo e um
      cookie de sessão não autoriza rotas internas.

paths:
  /admin/auth/login:
    post:
      tags: [Portal Authentication]
      operationId: loginPortalUser
      security: []
      description: >
        Autentica um usuário do portal no tenant da implantação e emite um cookie de
        sessão httpOnly. Credencial inválida, conta inativa e conta bloqueada produzem
        a mesma resposta, para não revelar a existência da conta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sessão emitida
          headers:
            Set-Cookie:
              description: Cookie de sessão httpOnly, SameSite=Lax e Secure em produção.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /admin/auth/logout:
    post:
      tags: [Portal Authentication]
      operationId: logoutPortalUser
      security:
        - PortalSession: []
      description: Revoga a sessão vigente no servidor e remove o cookie.
      responses:
        "204":
          description: Sessão revogada
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/auth/me:
    get:
      tags: [Portal Authentication]
      operationId: getPortalUser
      security:
        - PortalSession: []
      description: >
        Devolve o usuário da sessão. Revalida a ativação do usuário a cada chamada,
        de modo que desativar a conta invalida cookies já emitidos.
      responses:
        "200":
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users:
    post:
      tags: [Portal Users]
      operationId: createPortalUser
      security:
        - PortalSession: []
      description: Cria um usuário do portal. Exclusivo do papel ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortalUser"
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      tags: [Portal Users]
      operationId: listPortalUsers
      security:
        - PortalSession: []
      parameters:
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/UserRole"
        - name: active
          in: query
          schema:
            type: boolean
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Página de usuários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUserPage"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{userId}:
    get:
      tags: [Portal Users]
      operationId: getPortalUserById
      security:
        - PortalSession: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Usuário
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUser"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Portal Users]
      operationId: updatePortalUser
      security:
        - PortalSession: []
      description: >
        Altera nome, telefone e papel. Rebaixar o último ADMIN ativo é recusado com 422,
        porque trancaria todos para fora do portal.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePortalUser"
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUser"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /admin/users/{userId}/deactivate:
    post:
      tags: [Portal Users]
      operationId: deactivatePortalUser
      security:
        - PortalSession: []
      description: >
        Desativa a conta e revoga as sessões já emitidas. Recusa a autodesativação e a
        desativação do último ADMIN ativo.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Usuário desativado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUser"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /admin/users/{userId}/activate:
    post:
      tags: [Portal Users]
      operationId: activatePortalUser
      security:
        - PortalSession: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Usuário reativado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUser"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{userId}/password:
    post:
      tags: [Portal Users]
      operationId: setPortalUserPassword
      security:
        - PortalSession: []
      description: Define a senha de outro usuário e revoga todas as sessões dele.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPassword"
      responses:
        "200":
          description: Senha substituída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUser"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /admin/customers:
    post:
      tags: [Customer Records]
      operationId: createCustomer
      security:
        - PortalSession: []
      description: >
        Cadastra o cliente e já cria a sua localidade padrão, porque o cálculo de ICMS
        parte dela. Um REPRESENTATIVE só cadastra para a própria carteira: owner_user_id
        do corpo é ignorado e o titular passa a ser o autor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomer"
      responses:
        "201":
          description: Cliente criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      tags: [Portfolio]
      operationId: listPortfolioCustomers
      security:
        - PortalSession: []
      description: >
        Lista clientes já reduzidos ao que o papel permite ver. ADMIN e MANAGER enxergam
        todo o tenant, inclusive clientes sem titular; REPRESENTATIVE enxerga apenas a
        própria carteira. O escopo é aplicado na consulta ao banco.
      parameters:
        - $ref: "#/components/parameters/StateCodeFilter"
        - name: preferred_product_id
          in: query
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          schema:
            type: boolean
        - name: assigned
          in: query
          description: Filtra clientes com ou sem titular designado.
          schema:
            type: boolean
        - $ref: "#/components/parameters/SearchFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Página de clientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/me/customers:
    get:
      tags: [Portfolio]
      operationId: listMyPortfolioCustomers
      security:
        - PortalSession: []
      description: A carteira de quem está logado, qualquer que seja o papel.
      parameters:
        - $ref: "#/components/parameters/StateCodeFilter"
        - name: preferred_product_id
          in: query
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          schema:
            type: boolean
        - $ref: "#/components/parameters/SearchFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Página de clientes da carteira
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/customers/{customerId}:
    get:
      tags: [Portfolio]
      operationId: getPortfolioCustomer
      security:
        - PortalSession: []
      description: >
        Responde 404 tanto para cliente inexistente quanto para cliente fora da carteira.
        Um 403 no segundo caso confirmaria a existência da conta de outro representante.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Customer Records]
      operationId: updateCustomer
      security:
        - PortalSession: []
      description: "Edita o cadastro. Desativar o cliente é `active: false`."
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomer"
      responses:
        "200":
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /admin/customers/{customerId}/contacts:
    get:
      tags: [Customer Records]
      operationId: listCustomerContacts
      security:
        - PortalSession: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Contatos do cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerContactRecord"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Customer Records]
      operationId: createCustomerContact
      security:
        - PortalSession: []
      description: >
        O telefone é normalizado para E.164 antes de gravar e é único por tenant.
        Marcar este contato como principal desmarca o anterior na mesma transação.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerContact"
      responses:
        "201":
          description: Contato criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerContactRecord"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /admin/customers/{customerId}/contacts/{contactId}:
    patch:
      tags: [Customer Records]
      operationId: updateCustomerContact
      security:
        - PortalSession: []
      description: Desativar um contato também retira dele a marca de principal.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - $ref: "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerContact"
      responses:
        "200":
          description: Contato atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerContactRecord"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /admin/customers/{customerId}/locations:
    get:
      tags: [Customer Records]
      operationId: listCustomerLocations
      security:
        - PortalSession: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Localidades do cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerLocation"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Customer Records]
      operationId: createCustomerLocation
      security:
        - PortalSession: []
      description: >
        A UF é validada contra as 27 unidades federativas. A primeira localidade ativa de
        um cliente vira a padrão automaticamente.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerLocation"
      responses:
        "201":
          description: Localidade criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerLocation"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /admin/customers/{customerId}/locations/{locationId}:
    patch:
      tags: [Customer Records]
      operationId: updateCustomerLocation
      security:
        - PortalSession: []
      description: >
        Desativar ou desmarcar a localidade padrão devolve 422: promover outra é uma
        escolha comercial, e o sistema não elege sozinho para onde a mercadoria vai.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerLocation"
      responses:
        "200":
          description: Localidade atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerLocation"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /admin/customers/{customerId}/price-list:
    get:
      tags: [Pricing]
      operationId: getResolvedPriceList
      security:
        - PortalSession: []
      description: >
        Produtos preferidos do cliente, na ordem e com o alias dele, com o preço convertido
        para a UF da localidade onde ele recebe. Cliente sem produtos preferidos recebe o
        catálogo ativo inteiro. Regra de ICMS ausente ou ambígua interrompe a lista inteira
        com 409: entregar uma tabela silenciosamente incompleta faria o representante cotar
        em cima dela.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - name: location_id
          in: query
          description: Localidade a usar; omitida, vale a padrão ativa do cliente.
          schema:
            type: string
            format: uuid
        - name: reference_month
          in: query
          description: Competência; omitida, vale a mais recente já publicada.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Lista resolvida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedPriceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /admin/icms-rules:
    get:
      tags: [Pricing]
      operationId: listIcmsRules
      security:
        - PortalSession: []
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Matriz de ICMS
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IcmsRule"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Pricing]
      operationId: createIcmsRule
      security:
        - PortalSession: []
      description: >
        Cria uma regra para um par de UFs. `product_id` e `family_id` são mutuamente
        exclusivos: são níveis diferentes de especificidade e aceitá-los juntos tornaria a
        precedência ambígua. Exclusivo do papel ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIcmsRule"
      responses:
        "201":
          description: Regra criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IcmsRule"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /admin/customers/{customerId}/owner:
    put:
      tags: [Portfolio]
      operationId: assignCustomerOwner
      security:
        - PortalSession: []
      description: >
        Designa, transfere ou remove o titular. Exclusivo de ADMIN e MANAGER. Reatribuir o
        titular vigente é um no-op e não gera linha de histórico.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerAssignmentRequest"
      responses:
        "200":
          description: Cliente com o titular resultante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /admin/customers/{customerId}/assignment-history:
    get:
      tags: [Portfolio]
      operationId: listCustomerAssignmentHistory
      security:
        - PortalSession: []
      description: Trilha append-only de titularidade, da mais recente para a mais antiga.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Histórico de titularidade
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssignmentHistoryEntry"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal/interactions:
    post:
      tags: [Interactions]
      operationId: ingestInteractions
      description: >
        Projeta eventos de conversa na ficha do cliente. Responde 200 mesmo com itens
        recusados, com o desfecho de cada um: um evento não resolvido é problema daquele
        evento, e derrubar o lote inteiro faria o Gateway reenviar indefinidamente os que
        já tinham sido aceitos. Reenviar o mesmo `external_ref` não duplica.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Timestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestInteractions"
      responses:
        "200":
          description: Desfecho item a item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestInteractionsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /admin/customers/{customerId}/interactions:
    get:
      tags: [Interactions]
      operationId: getCustomerTimeline
      security:
        - PortalSession: []
      description: >
        Histórico do cliente, do mais recente para o mais antigo. Sujeito ao escopo de
        carteira: cliente fora dela responde 404, e não 403.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Página da linha do tempo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal/interaction-capabilities:
    get:
      tags: [Interaction Capabilities]
      operationId: getInternalInteractionCapabilities
      description: >
        Publica o manifesto versionado de intenções e ações permitidas pelo CRM para o
        Gateway durante uma sessão de contato. O manifesto não contém URLs, SQL, fórmulas
        comerciais nem conteúdo de preço.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Timestamp"
      responses:
        "200":
          description: Manifesto de capacidades de interação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionCapabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /health:
    get:
      security: []
      operationId: getHealth
      responses:
        "200":
          description: Serviço saudável
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: crm-conversacional-api

  /ready:
    get:
      security: []
      operationId: getReadiness
      responses:
        "200":
          description: Banco de dados acessível
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: crm-conversacional-api
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /internal/whatsapp/events:
    post:
      tags: [Internal]
      operationId: receiveWhatsappEvent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/Timestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappEvent"
      responses:
        "202":
          description: Evento aceito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal/outbound-status:
    post:
      tags: [Internal]
      operationId: updateOutboundStatus
      parameters:
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/Timestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundStatusUpdate"
      responses:
        "204":
          description: Status atualizado
        "404":
          $ref: "#/components/responses/NotFound"

  /customers/by-whatsapp/{phone}:
    get:
      tags: [Customers]
      operationId: findCustomerByWhatsapp
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Timestamp"
        - name: phone
          in: path
          required: true
          description: Telefone E.164, com o sinal + codificado na URL.
          schema:
            type: string
            pattern: "^\\+[1-9][0-9]{7,14}$"
      responses:
        "200":
          description: Cliente e contato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerContact"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /customers/{customerId}/preferred-products:
    get:
      tags: [Customers]
      operationId: listPreferredProducts
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Produtos preferenciais ativos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PreferredProduct"

  /price-lists/current:
    get:
      tags: [Price Lists]
      operationId: getCurrentPriceList
      parameters:
        - name: at
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Tabela ativa na data informada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceListSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /price-lists/current/by-whatsapp/{phone}:
    get:
      tags: [Price Lists]
      operationId: getCurrentPriceListByWhatsapp
      description: >
        Retorna a tabela ativa e seus itens para o contato ativo identificado pelo WhatsApp,
        sempre dentro do tenant assinado pelo Gateway. Itens indisponíveis não expõem preço.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Timestamp"
        - name: phone
          in: path
          required: true
          description: Telefone E.164, com o sinal + codificado na URL.
          schema:
            type: string
            pattern: "^\\+[1-9][0-9]{7,14}$"
      responses:
        "200":
          description: Contato, tabela vigente e itens de preço
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentPriceList"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /price-lists/current/by-whatsapp/{phone}/items:
    get:
      tags: [Price Lists]
      operationId: searchCurrentPriceListItemsByWhatsapp
      description: >
        Retorna somente os itens da tabela ativa que correspondem a todos os termos de busca
        no SKU, nome comercial, especificação ou família. Uma resposta 200 com itens vazios
        significa que o contato e a tabela existem, mas não houve correspondência.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Timestamp"
        - name: phone
          in: path
          required: true
          description: Telefone E.164, com o sinal + codificado na URL.
          schema:
            type: string
            pattern: "^\\+[1-9][0-9]{7,14}$"
        - name: query
          in: query
          required: true
          description: Termos do produto; todos devem corresponder deterministicamente.
          schema:
            type: string
            minLength: 2
            maxLength: 120
      responses:
        "200":
          description: Contato, tabela vigente e itens encontrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentPriceList"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /offers/preview:
    post:
      tags: [Offers]
      operationId: previewOffer
      description: Calcula a oferta sem persistir uma nova oferta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferRequest"
      responses:
        "200":
          description: Prévia calculada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferPreview"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /offers:
    post:
      tags: [Offers]
      operationId: createOffer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferRequest"
      responses:
        "201":
          description: Oferta persistida como fotografia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /offers/{offerId}:
    get:
      tags: [Offers]
      operationId: getOffer
      parameters:
        - $ref: "#/components/parameters/OfferId"
      responses:
        "200":
          description: Oferta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "404":
          $ref: "#/components/responses/NotFound"

  /offers/{offerId}/approve:
    post:
      tags: [Offers]
      operationId: approveOffer
      parameters:
        - $ref: "#/components/parameters/OfferId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved_by]
              properties:
                approved_by:
                  type: string
                  minLength: 1
                final_message:
                  type: string
      responses:
        "200":
          description: Oferta aprovada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "409":
          $ref: "#/components/responses/Conflict"

  /offers/{offerId}/send:
    post:
      tags: [Offers]
      operationId: sendOffer
      description: Envia somente ofertas previamente aprovadas.
      parameters:
        - $ref: "#/components/parameters/OfferId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Envio solicitado ao Gateway
          content:
            application/json:
              schema:
                type: object
                required: [offer_id, status]
                properties:
                  offer_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    const: PENDING
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    InternalHmac:
      type: apiKey
      in: header
      name: X-Signature
    PortalSession:
      type: apiKey
      in: cookie
      name: crm_session
      description: >
        Sessão com estado no servidor. O cookie carrega o token em claro; o banco
        guarda apenas o SHA-256 dele, e o logout revoga a sessão de fato.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    Signature:
      name: X-Signature
      in: header
      required: true
      schema:
        type: string
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      schema:
        type: string
        format: date-time
    TenantSlug:
      name: X-Tenant-Slug
      in: header
      required: true
      description: Tenant resolvido pelo Gateway para o aplicativo e fluxo ativos.
      schema:
        type: string
        minLength: 1
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    StateCodeFilter:
      name: state_code
      in: query
      description: UF do cliente, em duas letras.
      schema:
        type: string
        pattern: "^[A-Za-z]{2}$"
    SearchFilter:
      name: search
      in: query
      description: Termo aplicado a razão social, nome fantasia e documento.
      schema:
        type: string
        minLength: 2
        maxLength: 120
    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Assinatura ausente, inválida ou expirada
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Papel insuficiente para a operação
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Excesso de tentativas na janela
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflito de estado ou idempotência
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: Regra de negócio não atendida
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Dependência operacional indisponível
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        trace_id:
          type: string

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
          description: Normalizado para caixa baixa antes da busca.
        password:
          type: string
          minLength: 1
          format: password

    AuthenticatedUser:
      type: object
      required: [user_id, tenant_id, full_name, email, role]
      properties:
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [ADMIN, MANAGER, REPRESENTATIVE]

    UserRole:
      type: string
      enum: [ADMIN, MANAGER, REPRESENTATIVE]

    PortalUser:
      type: object
      required: [user_id, full_name, email, role, whatsapp_e164, active, last_login_at]
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        whatsapp_e164:
          type: [string, "null"]
        active:
          type: boolean
        last_login_at:
          type: [string, "null"]
          format: date-time

    PortalUserPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PortalUser"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    CreatePortalUser:
      type: object
      additionalProperties: false
      required: [full_name, email, password]
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          minLength: 3
          maxLength: 320
        password:
          type: string
          format: password
          description: Validada contra a política mínima antes de qualquer gravação.
        role:
          $ref: "#/components/schemas/UserRole"
        whatsapp_e164:
          type: [string, "null"]
          pattern: "^\\+[1-9][0-9]{7,14}$"

    UpdatePortalUser:
      type: object
      additionalProperties: false
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: "#/components/schemas/UserRole"
        whatsapp_e164:
          type: [string, "null"]
          pattern: "^\\+[1-9][0-9]{7,14}$"

    SetPassword:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password

    OwnerSummary:
      type: object
      required: [user_id, full_name, email]
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string

    CustomerSummary:
      type: object
      required:
        [customer_id, legal_name, trade_name, document_number, state_code, active, owner]
      properties:
        customer_id:
          type: string
          format: uuid
        legal_name:
          type: string
        trade_name:
          type: [string, "null"]
        document_number:
          type: [string, "null"]
        state_code:
          type: string
          pattern: "^[A-Z]{2}$"
        active:
          type: boolean
        owner:
          oneOf:
            - $ref: "#/components/schemas/OwnerSummary"
            - type: "null"
          description: Nulo quando o cliente ainda não tem representante titular.

    CustomerPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerSummary"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    StateCode:
      type: string
      description: Uma das 27 unidades federativas; validada na aplicação, não só no CHECK.
      pattern: "^[A-Za-z]{2}$"

    CreateCustomer:
      type: object
      additionalProperties: false
      required: [legal_name, state_code]
      properties:
        legal_name:
          type: string
          minLength: 1
          maxLength: 300
        state_code:
          $ref: "#/components/schemas/StateCode"
        trade_name:
          type: [string, "null"]
          maxLength: 300
        document_number:
          type: [string, "null"]
          maxLength: 32
        owner_user_id:
          type: [string, "null"]
          format: uuid
          description: Ignorado quando quem cria é REPRESENTATIVE.

    UpdateCustomer:
      type: object
      additionalProperties: false
      properties:
        legal_name:
          type: string
          minLength: 1
          maxLength: 300
        trade_name:
          type: [string, "null"]
          maxLength: 300
        document_number:
          type: [string, "null"]
          maxLength: 32
        state_code:
          $ref: "#/components/schemas/StateCode"
        active:
          type: boolean

    CustomerContactRecord:
      type: object
      required: [contact_id, name, whatsapp_e164, is_primary, active]
      properties:
        contact_id:
          type: string
          format: uuid
        name:
          type: string
        whatsapp_e164:
          type: string
          pattern: "^\\+[1-9][0-9]{7,14}$"
        is_primary:
          type: boolean
        active:
          type: boolean

    CreateCustomerContact:
      type: object
      additionalProperties: false
      required: [name, whatsapp_e164]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        whatsapp_e164:
          type: string
          description: Aceita a forma de apresentação; normalizado para E.164 na gravação.
        is_primary:
          type: boolean
          default: false

    UpdateCustomerContact:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        whatsapp_e164:
          type: string
        is_primary:
          type: boolean
        active:
          type: boolean

    CustomerLocation:
      type: object
      required: [location_id, label, state_code, city, is_default, active]
      properties:
        location_id:
          type: string
          format: uuid
        label:
          type: string
        state_code:
          type: string
          pattern: "^[A-Z]{2}$"
        city:
          type: [string, "null"]
        is_default:
          type: boolean
        active:
          type: boolean

    CreateCustomerLocation:
      type: object
      additionalProperties: false
      required: [label, state_code]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        state_code:
          $ref: "#/components/schemas/StateCode"
        city:
          type: [string, "null"]
          maxLength: 200
        is_default:
          type: boolean
          default: false

    UpdateCustomerLocation:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        state_code:
          $ref: "#/components/schemas/StateCode"
        city:
          type: [string, "null"]
          maxLength: 200
        is_default:
          type: boolean
        active:
          type: boolean

    ResolvedItem:
      type: object
      required:
        [product_id, sku, family_name, display_name, availability, base_price,
         final_price, tax_rate]
      properties:
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        family_name:
          type: string
        display_name:
          type: string
          description: Alias do cliente quando existir; senão, o nome comercial.
        specification:
          type: [string, "null"]
        unit:
          type: string
        availability:
          type: string
          enum: [AVAILABLE, OUT_OF_STOCK, SUSPENDED, FUTURE_ARRIVAL, CONSULT]
        base_price:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: Nulo quando não há preço comercial atual para o item.
        final_price:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: Preço convertido para a UF de destino.
        tax_rate:
          type: [string, "null"]
          description: Alíquota aplicada, em percentual.
        expected_arrival_date:
          type: [string, "null"]
          format: date
        arrival_note:
          type: [string, "null"]
        notes:
          type: [string, "null"]
        trace:
          type: [object, "null"]
          additionalProperties: true
          description: >
            Rastro do cálculo: regra aplicada, especificidade, alíquotas de origem e
            destino, valor líquido e final.

    ResolvedPriceList:
      type: object
      required:
        [customer_id, customer_name, location_id, location_label, origin_state,
         destination_state, reference_month, currency, items]
      properties:
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        location_id:
          type: string
          format: uuid
        location_label:
          type: string
        origin_state:
          type: string
        destination_state:
          type: string
        reference_month:
          type: string
          format: date
        currency:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedItem"

    IngestInteractions:
      type: object
      additionalProperties: false
      required: [interactions]
      properties:
        interactions:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/IncomingInteraction"

    IncomingInteraction:
      type: object
      additionalProperties: false
      required: [external_ref, direction, occurred_at]
      description: >
        `whatsapp_e164` ou `customer_id` é obrigatório: um evento que não se liga a um
        cliente é recusado com motivo, nunca gravado sem dono.
      properties:
        external_ref:
          type: string
          minLength: 1
          maxLength: 200
          description: Identificador do evento na origem. Chave da idempotência.
        direction:
          type: string
          enum: [INBOUND, OUTBOUND]
        occurred_at:
          type: string
          format: date-time
        whatsapp_e164:
          type: [string, "null"]
        customer_id:
          type: [string, "null"]
          format: uuid
        source:
          type: string
          default: whatsapp-gateway
        channel:
          type: string
          default: WHATSAPP
        summary:
          type: [string, "null"]
          description: Texto ou resumo. Truncado em 2000 caracteres antes de gravar.
        payload:
          type: [object, "null"]

    IngestInteractionsResult:
      type: object
      required: [created, duplicated, rejected, results]
      properties:
        created:
          type: integer
        duplicated:
          type: integer
        rejected:
          type: integer
        results:
          type: array
          items:
            type: object
            required: [external_ref, outcome]
            properties:
              external_ref:
                type: string
              outcome:
                type: string
                enum: [CREATED, DUPLICATE, REJECTED]
              interaction_id:
                type: [string, "null"]
                format: uuid
              reason:
                type: [string, "null"]

    Interaction:
      type: object
      required:
        [interaction_id, customer_id, channel, direction, source, external_ref, occurred_at]
      properties:
        interaction_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        contact_id:
          type: [string, "null"]
          format: uuid
        channel:
          type: string
        direction:
          type: string
          enum: [INBOUND, OUTBOUND]
        source:
          type: string
        external_ref:
          type: string
        occurred_at:
          type: string
          format: date-time
        summary:
          type: [string, "null"]

    InteractionPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Interaction"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    IcmsRule:
      type: object
      required:
        [rule_id, origin_state, destination_state, tax_rate, valid_from, priority, active]
      properties:
        rule_id:
          type: string
          format: uuid
        origin_state:
          type: string
          pattern: "^[A-Z]{2}$"
        destination_state:
          type: string
          pattern: "^[A-Z]{2}$"
        product_id:
          type: [string, "null"]
          format: uuid
        family_id:
          type: [string, "null"]
          format: uuid
        customer_id:
          type: [string, "null"]
          format: uuid
        tax_rate:
          type: string
        valid_from:
          type: string
          format: date
        valid_until:
          type: [string, "null"]
          format: date
        priority:
          type: integer
        active:
          type: boolean

    CreateIcmsRule:
      type: object
      additionalProperties: false
      required: [origin_state, destination_state, tax_rate, valid_from]
      properties:
        origin_state:
          $ref: "#/components/schemas/StateCode"
        destination_state:
          $ref: "#/components/schemas/StateCode"
        tax_rate:
          type: string
          description: Percentual entre 0 e 100, decimal.
        valid_from:
          type: string
          format: date
        valid_until:
          type: [string, "null"]
          format: date
        product_id:
          type: [string, "null"]
          format: uuid
        family_id:
          type: [string, "null"]
          format: uuid
        customer_id:
          type: [string, "null"]
          format: uuid
        priority:
          type: integer
          default: 100

    OwnerAssignmentRequest:
      type: object
      additionalProperties: false
      properties:
        owner_user_id:
          type: [string, "null"]
          format: uuid
          description: Nulo remove o titular; a remoção também entra no histórico.
        reason:
          type: [string, "null"]
          maxLength: 500

    AssignmentHistoryEntry:
      type: object
      required: [assigned_at, assigned_by, reason, owner]
      properties:
        assigned_at:
          type: string
          format: date-time
        assigned_by:
          type: string
          format: uuid
        reason:
          type: [string, "null"]
        owner:
          oneOf:
            - $ref: "#/components/schemas/OwnerSummary"
            - type: "null"
          description: Nulo quando o evento registrou a remoção do titular.

    WhatsappEvent:
      type: object
      additionalProperties: false
      required: [event_id, received_at, channel, waba_id, phone_number_id, from, message]
      properties:
        event_id:
          type: string
        received_at:
          type: string
          format: date-time
        channel:
          type: string
          const: whatsapp
        waba_id:
          type: string
        phone_number_id:
          type: string
        from:
          type: string
          pattern: "^[1-9][0-9]{7,14}$"
        message:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [text]
            text:
              type: string
        metadata:
          type: object
          additionalProperties: true

    EventAccepted:
      type: object
      required: [event_id, status]
      properties:
        event_id:
          type: string
        status:
          type: string
          enum: [ACCEPTED, ALREADY_PROCESSED]

    OutboundStatusUpdate:
      type: object
      required: [gateway_message_id, status, occurred_at]
      properties:
        gateway_message_id:
          type: string
        status:
          type: string
          enum: [SENT, DELIVERED, READ, FAILED]
        occurred_at:
          type: string
          format: date-time
        error:
          type: string

    CustomerContact:
      type: object
      required: [customer_id, customer_name, state_code, contact_id, contact_name, whatsapp_e164]
      properties:
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        state_code:
          type: string
          pattern: "^[A-Z]{2}$"
        contact_id:
          type: string
          format: uuid
        contact_name:
          type: string
        whatsapp_e164:
          type: string

    InteractionIntent:
      type: object
      required: [id, description, aliases, examples, action, required_slots]
      properties:
        id:
          type: string
        description:
          type: string
        aliases:
          type: array
          items:
            type: string
        examples:
          type: array
          items:
            type: string
        action:
          type: string
          enum: [GET_CURRENT_PRICE_LIST, SEARCH_CURRENT_PRICE_LIST_ITEMS]
        required_slots:
          type: array
          items:
            type: string

    InteractionCapabilities:
      type: object
      required: [provider, version, session_ttl_seconds, fallback_message, intents]
      properties:
        provider:
          type: string
          const: crm_api
        version:
          type: string
        session_ttl_seconds:
          type: integer
          minimum: 60
          maximum: 86400
        fallback_message:
          type: string
        intents:
          type: array
          items:
            $ref: "#/components/schemas/InteractionIntent"

    PreferredProduct:
      type: object
      required: [product_id, sku, display_name, display_order]
      properties:
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        display_name:
          type: string
        display_order:
          type: integer

    PriceListSummary:
      type: object
      required: [id, name, reference_month, valid_from, currency]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        reference_month:
          type: string
          format: date
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: [string, "null"]
          format: date-time
        currency:
          type: string
          pattern: "^[A-Z]{3}$"

    CurrentPriceListItem:
      type: object
      required:
        [product_id, family_name, sku, display_name, specification, unit, availability, base_price]
      properties:
        product_id:
          type: string
          format: uuid
        family_name:
          type: string
        sku:
          type: string
        display_name:
          type: string
        specification:
          type: [string, "null"]
        unit:
          type: string
          const: KG
        availability:
          type: string
          enum: [AVAILABLE, OUT_OF_STOCK, SUSPENDED, FUTURE_ARRIVAL, CONSULT]
        base_price:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: Nulo quando não existe preço comercial atual para o item indisponível.
        final_price:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: >
            Preço convertido para a UF onde o cliente recebe. Nulo quando a conversão está
            desligada (`CRM_WHATSAPP_ICMS_ENABLED`); nesse caso `base_price` é o valor a
            exibir. Quando presente, é ele que deve ir ao cliente.
        tax_rate:
          oneOf:
            - type: string
            - type: "null"
          description: Alíquota de destino aplicada, em porcentagem.
        expected_arrival_date:
          type: [string, "null"]
          format: date
        arrival_note:
          type: [string, "null"]
        notes:
          type: [string, "null"]

    CurrentPriceList:
      type: object
      required: [customer, price_list, items]
      description: >
        Tem dois regimes. Com a conversão desligada traz o catálogo da competência com
        `base_price` e sem par de UFs — o formato que o Gateway consome desde F1. Ligada,
        traz apenas os produtos preferidos do cliente, na ordem dele, com `final_price`
        convertido para a UF da localidade padrão.
      properties:
        customer:
          $ref: "#/components/schemas/CustomerContact"
        price_list:
          $ref: "#/components/schemas/PriceListSummary"
        origin_state:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
          description: UF do estabelecimento que fatura. Nulo com a conversão desligada.
        destination_state:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
          description: UF da localidade padrão do cliente. Nulo com a conversão desligada.
        items:
          type: array
          items:
            $ref: "#/components/schemas/CurrentPriceListItem"

    OfferRequest:
      type: object
      additionalProperties: false
      required: [customer_id, destination_state, payment_term, product_ids]
      properties:
        customer_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        destination_state:
          type: string
          pattern: "^[A-Z]{2}$"
        payment_term:
          type: string
          enum: [TERM, ANTICIPATED, DAYS_14]
        product_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        quantities_kg:
          type: object
          additionalProperties:
            type: string
            pattern: "^[0-9]+(\\.[0-9]{1,3})?$"

    Money:
      type: string
      description: Valor decimal; nunca ponto flutuante.
      pattern: "^-?[0-9]+(\\.[0-9]{1,4})?$"
      examples: ["12.0500"]

    OfferItem:
      type: object
      required:
        [product_id, display_name, base_price, payment_price, freight_per_kg,
         final_price_per_kg, availability]
      properties:
        product_id:
          type: string
          format: uuid
        display_name:
          type: string
        base_price:
          $ref: "#/components/schemas/Money"
        payment_price:
          $ref: "#/components/schemas/Money"
        freight_per_kg:
          $ref: "#/components/schemas/Money"
        final_price_per_kg:
          $ref: "#/components/schemas/Money"
        availability:
          type: string
          enum: [AVAILABLE, OUT_OF_STOCK, SUSPENDED, FUTURE_ARRIVAL, CONSULT]
        expected_arrival_date:
          type: [string, "null"]
          format: date
        note:
          type: [string, "null"]

    OfferPreview:
      type: object
      required: [customer_id, reference_month, currency, items, message_preview]
      properties:
        customer_id:
          type: string
          format: uuid
        reference_month:
          type: string
          format: date
        currency:
          type: string
          const: BRL
        items:
          type: array
          items:
            $ref: "#/components/schemas/OfferItem"
        message_preview:
          type: string

    Offer:
      allOf:
        - $ref: "#/components/schemas/OfferPreview"
        - type: object
          required: [id, status, created_at]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, SENT, FAILED, CANCELLED]
            approved_by:
              type: [string, "null"]
            approved_at:
              type: [string, "null"]
              format: date-time
            sent_at:
              type: [string, "null"]
              format: date-time
            created_at:
              type: string
              format: date-time
